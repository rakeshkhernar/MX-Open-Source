<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MX - Manipulation Index</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="header">
      <div class="logo-container">
        <div class="logo" id="headerLogo"></div>
        <div class="title-group">
          <h1>MX</h1>
          <p class="subtitle">Manipulation Index</p>
        </div>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="content" id="content">
      <div class="loading" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p>Analyzing...</p>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="actions">
      <button id="disableSiteBtn" class="btn btn-secondary" title="Disable MX on this site">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M7 7l10 10"></path>
        </svg>
        <span>Disable on this site</span>
      </button>
      <button id="refreshBtn" class="btn btn-icon" title="Refresh analysis" aria-label="Refresh analysis">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-2.35-5.65"></path>
          <path d="M20 4v6h-6"></path>
        </svg>
      </button>
      <button id="settingsBtn" class="btn btn-icon" title="Settings" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 21v-7"></path>
          <path d="M4 10V3"></path>
          <path d="M12 21v-9"></path>
          <path d="M12 8V3"></path>
          <path d="M20 21v-5"></path>
          <path d="M20 12V3"></path>
          <circle cx="4" cy="12" r="2"></circle>
          <circle cx="12" cy="10" r="2"></circle>
          <circle cx="20" cy="14" r="2"></circle>
        </svg>
      </button>
      <button id="helpBtn" class="btn btn-icon" title="Help" aria-label="Help">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M9.5 9a2.5 2.5 0 1 1 3.4 2.3c-.9.4-1.4 1-1.4 2.2"></path>
          <circle cx="12" cy="17" r="1"></circle>
        </svg>
      </button>
    </div>
  </div>
  <script src="../shared/shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
